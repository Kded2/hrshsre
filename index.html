<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0b16">
    <meta name="manhwa-tracker" content="2">
    <title>Мой Трекер Манхв</title>
    <link rel="icon" href="favicon.ico.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <script>
        // Скрипт Telegram нужен только внутри его окна: в браузере он лишний и может быть недоступен
        // Параметр server остаётся в адресе и после перезагрузки, когда хеш уже сменился
        if (/tgWebApp|[?&]server=/.test(location.hash + location.search)) {
            document.write('<script src="https://telegram.org/js/telegram-web-app.js?64"><\/script>');
        }
    </script>
    <script>
        // Применяем тему и оформление до отрисовки, чтобы не было вспышки
        (() => {
            try {
                const settings = JSON.parse(localStorage.getItem('manhwa-settings') || '{}');
                const saved = localStorage.getItem('theme') || 'dark';
                const dark = saved === 'auto' ? matchMedia('(prefers-color-scheme: dark)').matches : saved !== 'light';
                const root = document.documentElement;
                root.dataset.theme = dark ? 'dark' : 'light';
                root.dataset.accent = settings.accent || 'violet';
                root.dataset.glass = settings.glass || 'full';
            } catch (e) { /* без сохранённых настроек работают значения по умолчанию */ }
        })();
    </script>
</head>
<body>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

    <!-- Преломление жидкого стекла и набор иконок -->
    <svg class="defs" aria-hidden="true" focusable="false">
        <filter id="liquid-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="2" seed="7" result="noise"/>
            <feGaussianBlur in="noise" stdDeviation="2.4" result="soft"/>
            <feDisplacementMap in="SourceGraphic" in2="soft" scale="34" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V19a1 1 0 0 0 1 1h3.5v-5.5h3V20H17a1 1 0 0 0 1-1V9.5"/></symbol>
        <symbol id="i-library" viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.500 3.500 4.500v14c3.500 0 6.500.5 8.500 2 2-1.500 5-2 8.500-2v-14C17 4.500 14 5 12 6.500Z"/><path d="M12 6.500v14"/></symbol>
        <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-7"/><path d="M12 20V5"/><path d="M19 20v-10"/></symbol>
        <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.500M12 18.500V21M3 12h2.500M18.500 12H21M5.600 5.600l1.800 1.800M16.600 16.600l1.800 1.800M5.600 18.400l1.800-1.800M16.600 7.400l1.800-1.800"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.500"/><path d="m20 20-4.200-4.200"/></symbol>
        <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.800 2.500 5.200 5.700.8-4.100 4 1 5.700-5.100-2.700-5.100 2.700 1-5.700-4.100-4 5.700-.8Z"/></symbol>
        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.500-4.600-8.500-9.500C2.900 7.300 5 5 7.600 5c1.900 0 3.400 1 4.400 2.700C13 6 14.500 5 16.400 5c2.600 0 4.700 2.300 4.100 5.500C19.500 15.400 12 20 12 20Z"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.500 6.500 4 4"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.500 7h15M9.500 7V4.500h5V7M6.500 7l1 13h9l1-13"/></symbol>
        <symbol id="i-link" viewBox="0 0 24 24"><path d="M14 5h5v5"/><path d="m19 5-8.500 8.500"/><path d="M18 14v5H5V6h5"/></symbol>
        <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.500"/><circle cx="8.500" cy="8.500" r=".6"/><circle cx="15.500" cy="15.500" r=".6"/><circle cx="12" cy="12" r=".6"/></symbol>
        <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c.5 3.500 5.500 5.500 5.500 11a5.500 5.500 0 0 1-11 0c0-2 1-3.500 2-4.500.3 1.500 1 2.300 2 2.500C10 9 10.500 6 12 3Z"/></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7.500 9.500 12 5l4.500 4.500"/><path d="M4.500 19.500h15"/></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 5v11M7.500 11.500 12 16l4.500-4.500"/><path d="M4.500 19.500h15"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7.500"/></symbol>
        <symbol id="i-sort" viewBox="0 0 24 24"><path d="M8 5v14M4.500 15.500 8 19l3.500-3.500"/><path d="M16 19V5M12.500 8.500 16 5l3.500 3.500"/></symbol>
        <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.500"/><rect x="13" y="4" width="7" height="7" rx="1.500"/><rect x="4" y="13" width="7" height="7" rx="1.500"/><rect x="13" y="13" width="7" height="7" rx="1.500"/></symbol>
        <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.500h11M9 12h11M9 17.500h11"/><path d="M4.500 6.500h.01M4.500 12h.01M4.500 17.500h.01"/></symbol>
        <symbol id="i-select" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.500 12.200 2.500 2.500 4.500-5"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.600 5.600 7 7M17 17l1.400 1.400M5.600 18.400 7 17M17 7l1.400-1.400"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.500A8 8 0 0 1 9.500 4 8 8 0 1 0 20 14.500Z"/></symbol>
        <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 4 1.800 4.700L18.500 10.500l-4.700 1.800L12 17l-1.800-4.700-4.700-1.800 4.700-1.800Z"/><path d="M19 16v4M17 18h4"/></symbol>
        <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.500c1-1 1.500-2 1.500-4.500a4.500 4.500 0 0 1 9 0c0 2.500.5 3.500 1.500 4.500Z"/><path d="M10.500 19.500h3"/></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.500V12l3 2"/></symbol>
        <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 3.500 20.500 7 17 10.500"/><path d="M3.500 12V10a3 3 0 0 1 3-3h14"/><path d="M7 20.500 3.500 17 7 13.500"/><path d="M20.500 12v2a3 3 0 0 1-3 3h-14"/></symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5.500" width="16" height="14.500" rx="3"/><path d="M4 10.500h16M8.500 3.500v4M15.500 3.500v4"/></symbol>
        <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.500 18V6.500a1 1 0 0 1 1-1h5l2 2.500h8a1 1 0 0 1 1 1V18a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1Z"/></symbol>
        <symbol id="i-book" viewBox="0 0 24 24"><path d="M6 4.500h12v15H7.500A1.500 1.500 0 0 1 6 18Z"/><path d="M6 18a1.500 1.500 0 0 1 1.500-1.500H18"/></symbol>
        <symbol id="i-gamepad" viewBox="0 0 24 24"><path d="M7.500 7h9a4.500 4.500 0 0 1 4.400 3.600l.9 4.700a2.700 2.700 0 0 1-4.700 2.300L15 16H9l-2.600 1.600a2.700 2.700 0 0 1-4.200-2.300l.9-4.700A4.500 4.500 0 0 1 7.500 7Z"/><path d="M8 10v3M6.500 11.500h3"/><path d="M15.500 12.500h.01M17.500 10.500h.01"/></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="m14.500 5.500-6.500 6.500 6.500 6.500"/></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5.500v13M15 5.500v13"/></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.500v13l10.500-6.500Z"/></symbol>
        <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6.500 20.500v-16"/><path d="M6.500 5h11l-3 4 3 4h-11"/></symbol>
        <symbol id="i-mine" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.500"/><path d="M12 3.500v3M12 17.500v3M3.500 12h3M17.500 12h3M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"/></symbol>
        <symbol id="i-snake" viewBox="0 0 24 24"><path d="M4 18.500h11a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h9"/><path d="M18 6.500h.01"/></symbol>
        <symbol id="i-bricks" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="4" rx="1"/><rect x="13" y="4" width="7" height="4" rx="1"/><rect x="8.500" y="10" width="7" height="4" rx="1"/><path d="M8 20h8"/></symbol>
        <symbol id="i-pong" viewBox="0 0 24 24"><path d="M6 5v7M18 12v7"/><circle cx="12" cy="11" r="1.500"/></symbol>
        <symbol id="i-cards" viewBox="0 0 24 24"><rect x="4" y="6.500" width="10" height="14" rx="2"/><path d="M9 3.500h8a2 2 0 0 1 2 2v11"/></symbol>
    </svg>

    <header class="topbar">
        <a class="brand" href="#home" aria-label="На главную">
            <span class="brand-mark"><svg class="icon"><use href="#i-library"/></svg></span>
            <span class="brand-name">Мой Трекер Манхв</span>
        </a>
        <div class="topbar-actions glass liquid">
            <button class="round-btn" data-action="palette" title="Поиск и команды (Ctrl+K)" aria-label="Поиск и команды"><svg class="icon"><use href="#i-search"/></svg></button>
            <button class="round-btn" data-action="random" title="Случайный тайтл (R)" aria-label="Случайный тайтл"><svg class="icon"><use href="#i-dice"/></svg></button>
            <button class="round-btn" data-action="toggle-theme" title="Переключить тему (T)" aria-label="Переключить тему"><svg class="icon"><use id="theme-icon" href="#i-moon"/></svg></button>
        </div>
    </header>

    <div id="disk-banner" class="disk-banner glass" role="status" hidden></div>
    <main id="view" class="view" tabindex="-1"></main>

    <div class="dock">
        <nav class="tabbar glass liquid" aria-label="Разделы">
            <span class="tab-pill" aria-hidden="true"></span>
            <a class="tab" href="#home" data-route="home"><svg class="icon"><use href="#i-home"/></svg><span>Главная</span></a>
            <a class="tab" href="#library" data-route="library"><svg class="icon"><use href="#i-library"/></svg><span>Библиотека</span></a>
            <a class="tab" href="#stats" data-route="stats"><svg class="icon"><use href="#i-chart"/></svg><span>Статистика</span></a>
            <a class="tab" href="#games" data-route="games"><svg class="icon"><use href="#i-gamepad"/></svg><span>Игры</span></a>
            <a class="tab" href="#settings" data-route="settings"><svg class="icon"><use href="#i-gear"/></svg><span>Настройки</span></a>
        </nav>
        <button class="dock-add glass liquid" data-action="add" title="Добавить манхву (N)" aria-label="Добавить манхву"><svg class="icon"><use href="#i-plus"/></svg></button>
    </div>

    <div id="bulk-bar" class="bulk-bar glass" hidden></div>
    <div id="toasts" class="toasts" popover="manual" role="status" aria-live="polite"></div>
    <div id="tip" class="tip" hidden></div>

    <!-- Карточка манхвы -->
    <dialog id="detail-sheet" class="sheet sheet-wide glass" aria-label="Карточка манхвы">
        <div id="detail-body"></div>
    </dialog>

    <!-- Добавление и редактирование -->
    <dialog id="form-sheet" class="sheet glass" aria-labelledby="form-title">
        <form id="manga-form" class="sheet-body" novalidate>
            <div class="sheet-head">
                <h2 id="form-title">Новая манхва</h2>
                <button type="button" class="round-btn" data-action="close-sheet" aria-label="Закрыть"><svg class="icon"><use href="#i-close"/></svg></button>
            </div>

            <div class="field">
                <label for="f-title">Название</label>
                <div class="input-row">
                    <input id="f-title" type="text" autocomplete="off" placeholder="Например, Поднятие уровня в одиночку">
                    <button type="button" class="btn" data-action="lookup" title="Найти в Shikimori и AniList: обложка, жанры и главы подставятся сами"><svg class="icon"><use href="#i-sparkles"/></svg>Найти</button>
                </div>
                <div class="field-error" data-error="title"></div>
                <div id="lookup-results" class="lookup" hidden></div>
            </div>

            <div class="field">
                <label for="f-alt">Другое название</label>
                <input id="f-alt" type="text" autocomplete="off" placeholder="Оригинальное или альтернативное">
            </div>

            <div class="field">
                <span class="label">Статус</span>
                <div id="f-status" class="chips" role="radiogroup" aria-label="Статус"></div>
            </div>

            <div class="field-grid">
                <div class="field">
                    <label for="f-current">Прочитано глав</label>
                    <input id="f-current" type="number" min="0" inputmode="numeric" value="0">
                    <div class="field-error" data-error="current"></div>
                </div>
                <div class="field">
                    <label for="f-total">Всего глав</label>
                    <input id="f-total" type="number" min="0" inputmode="numeric" placeholder="Не знаю">
                    <div class="field-error" data-error="total"></div>
                </div>
            </div>

            <label class="switch-row">
                <span>Онгоинг<small>Главы ещё выходят</small></span>
                <input id="f-ongoing" type="checkbox" class="switch">
            </label>

            <div class="field" id="f-days-field" hidden>
                <span class="label">Дни выхода глав</span>
                <div id="f-days" class="chips" role="group" aria-label="Дни выхода глав"></div>
            </div>

            <div class="field-grid">
                <div class="field">
                    <label for="f-date">Последнее чтение</label>
                    <input id="f-date" type="date">
                </div>
                <div class="field">
                    <label for="f-link">Ссылка</label>
                    <input id="f-link" type="url" placeholder="https://...">
                    <div class="field-error" data-error="link"></div>
                </div>
            </div>

            <div class="field">
                <label for="f-genres">Жанры и теги</label>
                <input id="f-genres" type="text" autocomplete="off" placeholder="Фэнтези, Экшен, Романтика">
            </div>

            <div class="field">
                <span class="label">Обложка</span>
                <div id="cover-drop" class="cover-drop" tabindex="0" role="button" aria-label="Выбрать обложку">
                    <img id="cover-preview" alt="" referrerpolicy="no-referrer" hidden>
                    <div class="cover-drop-hint">
                        <svg class="icon"><use href="#i-upload"/></svg>
                        <span>Перетащи файл, вставь из буфера или нажми</span>
                    </div>
                    <button type="button" id="cover-remove" class="round-btn" aria-label="Удалить обложку" hidden><svg class="icon"><use href="#i-close"/></svg></button>
                </div>
                <input id="f-cover-file" type="file" accept="image/*" hidden>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="form-submit">Добавить</button>
        </form>
    </dialog>

    <!-- Палитра команд -->
    <dialog id="palette" class="sheet palette glass" aria-label="Поиск и команды">
        <div class="palette-input">
            <svg class="icon"><use href="#i-search"/></svg>
            <input id="palette-query" type="text" autocomplete="off" placeholder="Тайтл или команда..." aria-label="Поиск">
            <kbd>Esc</kbd>
        </div>
        <div id="palette-results" class="palette-results" role="listbox"></div>
    </dialog>

    <!-- Подтверждение -->
    <dialog id="ask" class="sheet ask glass" aria-labelledby="ask-title">
        <form method="dialog" class="sheet-body">
            <h2 id="ask-title"></h2>
            <p id="ask-text"></p>
            <div id="ask-buttons" class="ask-buttons"></div>
        </form>
    </dialog>

    <input id="import-input" type="file" accept=".json,application/json" hidden>

    <script src="games.js"></script>
    <script src="script.js"></script>
</body>
</html>
